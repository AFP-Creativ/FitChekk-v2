# SwiftLint Configuration for FitChekk
# Based on PRODUCTION_BUILD_PLAN.md specifications

disabled_rules:
  - trailing_whitespace
  - todo  # Allow TODOs during development
  - nesting  # Allow nested types (standard TCA Delegate pattern)

opt_in_rules:
  - empty_count
  - force_unwrapping

line_length: 120

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 1000

# Allow short names for design system constants
identifier_name:
  min_length:
    warning: 2
    error: 1
  allowed_symbols: ["_"]
  validates_start_with_lowercase: true

excluded:
  - Pods
  - .build
  - Tests
  - FitChekkTests
  - FitChekkUITests
  - Package.swift
  # Temporarily exclude Phase 3 Wardrobe files pending refactoring
  - FitChekk/Features/Wardrobe/AddItemView.swift
  - FitChekk/Features/Wardrobe/EditItemView.swift
  - FitChekk/Features/Wardrobe/WardrobeView.swift
  - FitChekk/Features/Wardrobe/WardrobeItemDetailView.swift
  - FitChekk/Features/Wardrobe/Components/WardrobeItemCard.swift
  - FitChekk/Services/Data/DatabaseService.swift

